name: Music RVC API

on:
  push:
    branches:
      - release
    paths:
      - services/music-rvc-api/**
      - .github/workflows/music-rvc-api.yml

permissions:
  contents: read

concurrency:
  group: music-rvc-api-release
  cancel-in-progress: false

env:
  SERVICE: music-rvc-api
  VERSION: 2.2.231006

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
            shellcheck "$script"
          done < <(find "services/${SERVICE}" -type f -name '*.sh' -print0)

      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: services/music-rvc-api
        run: python3 -m unittest discover -s "services/${SERVICE}/tests" -v

  build:
    name: Build and push image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image metadata
        id: image
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
        shell: bash
        run: |
          set -euo pipefail
          registry_endpoint="${REGISTRY_ENDPOINT%/}"
          if [[ -z "$registry_endpoint" ]]; then
            echo "REGISTRY_ENDPOINT_ALIYUN is required" >&2
            exit 1
          fi

          image_name="${registry_endpoint}/wod/verdantflare-app"
          image_version="${SERVICE}-v${VERSION}"
          echo "registry_endpoint=$registry_endpoint" >> "$GITHUB_OUTPUT"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"
          echo "image_version=$image_version" >> "$GITHUB_OUTPUT"

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry_endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Verify version is unpublished
        env:
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
          IMAGE_VERSION: ${{ steps.image.outputs.image_version }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${IMAGE_VERSION}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "$image already exists; published versions are immutable" >&2
            exit 1
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ env.SERVICE }}
          file: services/${{ env.SERVICE }}/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.image_version }}
          cache-from: type=gha,scope=${{ env.SERVICE }}
          cache-to: type=gha,mode=max,scope=${{ env.SERVICE }}

      - name: Image push success
        env:
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
          IMAGE_VERSION: ${{ steps.image.outputs.image_version }}
        run: |
          echo "${IMAGE_NAME}:${IMAGE_VERSION} built and pushed successfully."
