[project]
name = "verdantflare-music-lyrics-aligner-api"
version = "0.1.1"
description = "VerdantFlare music-lyrics-aligner-api service"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "numpy==2.2.6",
  "openai-whisper==20250625",
  "python-multipart==0.0.20",
  "stable-ts==2.19.1",
  "torch==2.7.1",
  "torchaudio==2.7.1",
  "uvicorn==0.35.0",
]

[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Docker and tests run the explicitly copied source via PYTHONPATH.
py-modules = []

[dependency-groups]
test = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
]
