[project]
name = "verdantflare-music-mcp-server"
version = "0.6.1"
description = "VerdantFlare music-mcp-server service"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.1.0",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "uvicorn==0.40.0",
]

[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Docker and tests run the explicitly copied source via PYTHONPATH.
py-modules = []
