apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-minimax-music3-api
spec:
  replicas: 1
  progressDeadlineSeconds: 3600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: music-minimax-music3-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: music-minimax-music3-api
    spec:
      hostIPC: true
      nodeSelector:
        kubernetes.io/hostname: 10.241.109.7
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-4090
                  - key: nvidia.com/gpu.sharing-strategy
                    operator: In
                    values:
                      - none
      containers:
        - name: api
          image: registry.cn-qingdao.aliyuncs.com/wod/verdantflare-app:music-minimax-music3-api-v0.1.1
          imagePullPolicy: IfNotPresent
          args:
            - --mem-fraction-static
            - "0.80"
          env:
            - name: HF_ENDPOINT
              value: https://hf-mirror.com
            - name: HF_HUB_DISABLE_XET
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "2"
            limits:
              cpu: "32"
              memory: 128Gi
              nvidia.com/gpu: "2"
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 120
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: models
              mountPath: /models/MiniMax-Music3
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: music3-models
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
---
