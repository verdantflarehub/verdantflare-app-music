apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: music-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: music-mcp-server
    spec:
      containers:
        - name: api
          image: registry.cn-qingdao.aliyuncs.com/wod/verdantflare-app:music-mcp-server-v0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MUSIC3_URL
              value: http://music-minimax-music3-api:8000
            - name: UVR5_URL
              value: http://music-uvr5-api:8000
            - name: RVC_URL
              value: http://music-rvc-api:8000
            - name: MIXER_URL
              value: http://music-audio-mixer-api:8000
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 5
