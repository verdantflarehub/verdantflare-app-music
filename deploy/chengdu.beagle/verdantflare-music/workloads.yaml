apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: music-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: music-mcp-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: 10.241.109.7
      containers:
        - name: api
          image: registry.cn-qingdao.aliyuncs.com/wod/verdantflare-app:music-mcp-server-v0.4.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MUSIC_ARTIFACT_ROOT
              value: /data/projects
            - name: MUSIC_ASSET_IMPORT_ORIGINS
              value: https://cache.ali.wodcloud.com
            - name: MUSIC3_URL
              value: http://music-minimax-music3-api:8000
            - name: UVR5_URL
              value: http://music-uvr5-api:8000
            - name: RVC_URL
              value: http://music-rvc-api:8000
            - name: MIXER_URL
              value: http://music-audio-mixer-api:8000
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: projects
              mountPath: /data/projects
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: projects
          persistentVolumeClaim:
            claimName: music-projects
